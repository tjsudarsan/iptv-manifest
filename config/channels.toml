[classify_order]
# Rule evaluation order for selection="all" languages (devotional wins over music, etc.).
ta = ["ta-devotional", "ta-music", "ta-news", "ta-entertainment"]

# ---------------------------------------------------------------- overrides & manual channels
# Per-channel tweaks, keyed by full channel ID. Supported keys: name, logo, category,
# url (forces this stream), unavailable ("reason": keep listed but not playable),
# disabled (true hides the channel entirely).
#
# The generator probes streams from GitHub's US servers. These pass there but fail from India
# (the TV's own checks on 2026-11-04), so they stay unavailable until re-verified on the TV.
[overrides."FoxSports2.us"]
unavailable = "Fails from India (TV check 2026-11-04: timeout)"

[overrides."WillowSports.us"]
unavailable = "Fails from India (TV check 2026-11-04: HTTP 403)"

#
# [overrides."SunTV.in@HD"]
# name = "Sun TV"
#
# Channels not in any source:
# [[manual]]
# id = "MyChannel.in"
# name = "My Channel"
# language = "ta"
# category = "ta-entertainment"
# url = "https://example.com/live/master.m3u8"
# logo = "https://example.com/logo.png"

# ---------------------------------------------------------------- programme guide
# Published separately as docs/v1/guide.json (Pages) and the `guide` branch; see generator/guide.py.
[guide]
hours_behind = 2
hours_ahead = 36
title_max = 80
description_max = 160
min_channels = 10          # fewer channels with programmes than this keeps the previous guide
workers = 6
# Pin a source for a channel: "airtelxstream.in:<site_id>" or "i.mjh.nz:<path>#<channel>"
[guide.overrides]

# ---------------------------------------------------------------- app shortcuts
# Tiles that open another installed app (usually straight to a live channel) instead of playing a stream.
# Used for paid channels the owner already gets through a subscription app. `uri` is the app's own link
# for that channel (empty: just open the app). No channel number; Channel +/- does not reach them.
[[shortcuts]]
id = "sunnxt.KTV.in"
name = "KTV"
category = "ta-sun"
app = "com.suntv.sunnxt"
uri = ""
logo = "https://jiotvimages.cdn.jio.com/dare_images/images/KTV_HD.png"

